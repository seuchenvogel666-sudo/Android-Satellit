plugins {
    id 'com.android.application'
}

android {
    namespace 'de.aktiengraphen.satellit'
    compileSdk 34

    defaultConfig {
        applicationId 'de.aktiengraphen.satellit'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '3.6'
    }

    // Signierschlüssel kommt NUR aus den GitHub-Secrets (SATELLIT_KEYSTORE, SATELLIT_PASSWORT) –
    // er steht nicht im öffentlichen Repository, damit niemand gefälschte Updates signieren kann
    signingConfigs {
        fest {
            storeFile file(System.getenv('SATELLIT_KEYSTORE_DATEI') ?: 'kein-schluessel.keystore')
            storePassword System.getenv('SATELLIT_PASSWORT')
            keyAlias 'satellit'
            keyPassword System.getenv('SATELLIT_PASSWORT')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
        debug {
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // QR-Scanner der Google Play-Dienste (braucht keine Kamera-Berechtigung)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // Meldungen im Hintergrund abholen (etwa alle 15 Minuten, nur im Heimnetz)
    implementation 'androidx.work:work-runtime:2.9.1'
}
