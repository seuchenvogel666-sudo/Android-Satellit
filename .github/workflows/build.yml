name: Aktien-Satellit bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Das Android-SDK ist auf den GitHub-Rechnern bereits installiert (ANDROID_HOME)
      - name: Android-SDK prüfen
        run: echo "SDK: $ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk aktien-satellit.apk

      - name: Als Build-Ergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: aktien-satellit
          path: aktien-satellit.apk

      # fester Download-Link: .../releases/download/satellit-latest/aktien-satellit.apk
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view satellit-latest || gh release create satellit-latest --title "Aktien-Satellit" --notes "Neueste Version der Handy-App (nur Ansicht)."
          gh release upload satellit-latest aktien-satellit.apk --clobber
